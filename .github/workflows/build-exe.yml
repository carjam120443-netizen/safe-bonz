name: Build Safe Bonz EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Extract Bonzi sprite archive
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Filter '*.zip' -File | Where-Object { $_.Name -like '*Bonzi*' } | Select-Object -First 1
          if ($null -eq $zip) {
            Write-Host 'No Bonzi sprite archive found; continuing without sprite extraction.'
            exit 0
          }
          New-Item -ItemType Directory -Force -Path assets\sprites | Out-Null
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath assets\sprites -Force
          Write-Host "Extracted $($zip.Name) into assets\sprites"

      - name: Check assets
        shell: pwsh
        run: |
          if (Test-Path "assets") {
            Get-ChildItem assets -Recurse -File | Select-Object FullName
          } else {
            Write-Host "No assets directory found."
          }

      - name: Build executable
        shell: pwsh
        run: |
          $args = @(
            '--noconfirm', '--clean', '--onefile', '--windowed',
            '--name', 'SafeBonz',
            '--add-data', 'messages;messages',
            'src/main.py'
          )
          if (Test-Path "assets") {
            $args += @('--add-data', 'assets;assets')
          }
          pyinstaller @args

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeBonz-Windows
          path: dist/SafeBonz.exe
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SafeBonz.exe
