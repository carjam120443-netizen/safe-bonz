name: Build Safe Bonz EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Check optional assets
        shell: pwsh
        run: |
          if (Test-Path "assets") {
            Write-Host "Assets directory found."
          } else {
            Write-Host "No assets directory yet; building without it."
          }

      - name: Build executable
        shell: pwsh
        run: |
          $args = @(
            '--noconfirm', '--clean', '--onefile', '--windowed',
            '--name', 'SafeBonz',
            '--add-data', 'messages;messages',
            'src/main.py'
          )
          if (Test-Path "assets") {
            $args += @('--add-data', 'assets;assets')
          }
          pyinstaller @args

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeBonz-Windows
          path: dist/SafeBonz.exe
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SafeBonz.exe
